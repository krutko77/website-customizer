<!--
  Honeypot — защита форм от ботов. es-trans.ru

  Добавить в КАЖДУЮ из трёх форм: #form-customs, #form-offer, #form-driver
  (перед кнопкой отправки). Формы продублированы на каждой странице —
  нужна полная пересборка Gulp.

  Как работает: поле скрыто от человека, но видно боту, который заполняет
  все поля подряд. Если поле пришло непустым — sendmail.php молча
  возвращает «успех» и не отправляет письмо.

  ВАЖНО про доступность и корректность:
    - НЕ используем type="hidden" — боты его пропускают, смысл теряется.
    - Прячем через inline-стиль, а не класс: класс легко удалить при
      правке CSS и защита тихо перестанет работать.
    - tabindex="-1" — поле не получит фокус при переходе по Tab.
    - autocomplete="off" — браузер не подставит в него адрес сайта.
    - aria-hidden="true" — скринридер не прочитает поле пользователю.
    - Имя "website" выбрано намеренно: боты охотно заполняют поля с таким
      названием. Если менять — поменять и в sendmail.php (блок «1. Антибот»).
-->
<div style="position:absolute!important;left:-9999px!important;top:auto!important;width:1px!important;height:1px!important;overflow:hidden!important;"
     aria-hidden="true">
	<label for="website-{FORM_ID}">Не заполняйте это поле</label>
	<input type="text"
	       id="website-{FORM_ID}"
	       name="website"
	       value=""
	       tabindex="-1"
	       autocomplete="off">
</div>

<!--
  {FORM_ID} заменить на идентификатор формы, чтобы id не повторялись
  на странице (в разметке сайта все три формы соседствуют в попапах):

    #form-customs  ->  website-customs
    #form-offer    ->  website-offer
    #form-driver   ->  website-driver

  Атрибут name="website" во всех трёх формах ОДИНАКОВЫЙ — меняется
  только id. Дубли id — невалидная разметка, из-за неё label может
  указывать на чужое поле (ровно такой баг уже был на этом сайте
  с чекбоксом согласия в форме «Водителям», см. аудит 2026-08-17).
-->
