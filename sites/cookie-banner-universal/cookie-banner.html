<!-- ============================================================ -->
<!-- 1) <head>: обёртка счётчика(ов) аналитики.                     -->
<!--    Пример — Яндекс.Метрика. Для Google Analytics/GTM принцип   -->
<!--    тот же: ВСЯ загрузка скрипта-счётчика должна быть внутри    -->
<!--    window.__cbInitAnalytics, не только вызов инициализации.    -->
<!-- ============================================================ -->
<script type="text/javascript">
	window.__cbInitAnalytics = function () {
		if (window.__cbAnalyticsInited) return;
		window.__cbAnalyticsInited = true;

		// --- Яндекс.Метрика ---
		(function(m, e, t, r, i, k, a) {
			m[i] = m[i] || function() {
				(m[i].a = m[i].a || []).push(arguments)
			};
			m[i].l = 1 * new Date();
			for (var j = 0; j < document.scripts.length; j++) {
				if (document.scripts[j].src === r) {
					return;
				}
			}
			k = e.createElement(t), a = e.getElementsByTagName(t)[0], k.async = 1, k.src = r, a.parentNode.insertBefore(k, a)
		})(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js?id=XXXXXXXX', 'ym');

		ym('XXXXXXXX', 'init', {
			ssr: true,
			webvisor: true,
			clickmap: true,
			ecommerce: 'dataLayer',
			accurateTrackBounce: true,
			trackLinks: true
		});

		// --- Пример: Google Analytics / gtag.js (если нужен) ---
		// var gaScript = document.createElement('script');
		// gaScript.async = true;
		// gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX';
		// document.head.appendChild(gaScript);
		// window.dataLayer = window.dataLayer || [];
		// function gtag() { dataLayer.push(arguments); }
		// gtag('js', new Date());
		// gtag('config', 'G-XXXXXXXXXX');
	};
</script>
<noscript>
	<div><img src="https://mc.yandex.ru/watch/XXXXXXXX" style="position:absolute; left:-9999px;" alt="" /></div>
</noscript>
